# @package _global_
# Run: python scripts/run_tts_eval.py --config-path=../config --config-name=experiments/offline_best_of_n/kernelbench/offline_bon_vllm_k2_think_v2_kernelbench_uhead
# Note: Do NOT specify CUDA_VISIBLE_DEVICES when submitting via scripts/slurm/submit.sh - SLURM assigns GPUs automatically
# Offline Best-of-N with K2-Think-V2 (vLLM) + uhead scorer on KernelBench
# Generates N complete trajectories, splits post-hoc, selects best based on min step uhead score

defaults:
  - /config
  - /model/vllm_qwen3
  - /generation/default
  - /system/default
  - /strategy/offline_bon
  - /scorer/uhead_vllm
  - /evaluation/default
  - _self_

# Run naming
run_name: "offline_bon_vllm_k2_think_v2_kernelbench_uhead_seed${system.seed}_${now:%H-%M-%S}"

# Main configuration
verbose: true
report_to: wandb
wandb_project: llm-tts-kernelbench
wandb_group: "offline_bon_k2_think_v2_kernelbench_uhead"

# Model configuration (vLLM backend)
model:
  type: "vllm"
  model_path: "LLM360/K2-Think-V2"
  model_short_name: "k2_think_v2"
  gpu_memory_utilization: 0.8
  tensor_parallel_size: 1
  enable_prefix_caching: true
  trust_remote_code: true
  max_context_budget: 32768
  quantization: "bitsandbytes"  # Optional: "bitsandbytes", "awq", "gptq", etc.
  kv_cache_dtype: "fp8"  # Optional: "fp8", "fp8_e5m2", "fp8_e4m3", etc.
  reasoning_effort: "medium"  # Custom setting to control thinking mode aggressiveness

# System configuration
system:
  device: cuda
  seed: 42

scorer:
  type: uhead
  uq_head_path: "rediska0123/uhead_hs_K2-Think-V2_10epochs"
  max_model_len: 32000
  gpu_memory_utilization: 0.15
  tensor_parallel_size: 1
  device: cuda:0

# Generation configuration
generation:
  max_new_tokens: 32000
  temperature: 0.65
  top_p: 0.95
  top_k: 20
  batch_size: 1
  max_length: 65536

# Strategy - Offline Best-of-N
strategy:
  max_steps: 100
  # Step boundary detector settings - used for post-hoc step splitting
  max_step_tokens: 4096
  num_trajectories: 8  # Number of complete trajectories to generate per question

# Dataset configuration - KernelBench
dataset:
  data_name: "kernelbench"
  dataset_path: "ai-nikolai/KernelBench"
  dataset_split: "level_1"  # Options: level_1, level_2, level_3
  subset: null
  offset: 0
  question_field: "question"  # KernelAct loader provides correct prompt format
  answer_field: "answer"  # Reference PyTorch implementation
  answer_format: "code"
  prompt_file: null  # KernelAct API provides correct prompt format
  # KernelBench-specific settings
  level: 1  # Dataset level (1, 2, or 3)
  prompt_type: "improve"  # KernelAct prompt type: "improve", "kernelbench", "normal"
  trial: 1  # Trial number for TTS iteration

# Evaluation configuration (KernelBench uses custom evaluation)
evaluation:
  evaluators: []
  batch_evaluators: []
