name: BELT adapter

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "thinkbooster/belt/**"
      - "thinkbooster/scorers/step_scorer_belt.py"
      - "thinkbooster/strategies/strategy_belt.py"
      - "tests/belt/**"
      - "config/**/belt*"
      - "config/experiments/belt/**"
      - "scripts/run_tts_eval.py"
      - "scripts/utils/results.py"
      - "scripts/analysis/reeval.py"
      - "thinkbooster/generators/**"
      - "tests/run_tts_eval/**"
      - "pyproject.toml"
      - ".github/workflows/belt.yml"

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test environment
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          from pathlib import Path
          import tomllib
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          requirements = [r for r in project['dependencies']
                          if not r.startswith(('torch', 'vllm', 'transformers'))]
          Path('/tmp/belt-test-requirements.txt').write_text('\n'.join(requirements) + '\n')
          PY
          python -m pip install -r /tmp/belt-test-requirements.txt transformers==4.56.2 pytest pytest-cov
          python -m pip install --no-deps -e .
      - name: Run adapter and factory tests
        run: |
          python -m pytest tests/belt -m "not integration" -o addopts= -v
          python tests/strategy_registry.py --validate
      - name: Run the real Hydra entrypoint (config composition, resume, crash path)
        run: |
          for name in math500_qwen3_1p7b math500_qwen3_1p7b_vllm; do
            python scripts/run_tts_eval.py --config-path "$PWD/config" \
              --config-name "experiments/belt/$name" --cfg job \
              strategy.policy_path=/dev/null > /dev/null
          done
          python -m pytest tests/run_tts_eval/test_crash_reporting.py \
            tests/run_tts_eval/test_batch_failures.py -o addopts= -v
      - name: Install pinned native BELT reader
        run: |
          git clone https://github.com/EdisonNi-hku/BELT.git "$RUNNER_TEMP/belt-runtime"
          git -C "$RUNNER_TEMP/belt-runtime" checkout 332eab8d00592793c991686fd6e958e0f3c0f8ea
          python -m pip install --no-deps -e "$RUNNER_TEMP/belt-runtime"
      - name: Check reader parity, Qwen tokenizer block ends and block rules vs BELT
        env:
          BELT_TEST_CACHE: ${{ runner.temp }}/belt-hf
        run: |
          python -m pytest tests/belt/test_native_reader.py -m integration -o addopts= -v
          python -m pytest tests/belt/test_blocks.py -o addopts= -v
